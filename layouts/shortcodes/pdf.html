   <div class="pdf-embed" style="width:100%;margin:2rem 0;">
     <iframe
       src="{{ .Get "src" }}#view=FitH&toolbar=0&navpanes=0"
       title="{{ .Get "title" | default "PDF document" }}"
       style="width:100%;height:80vh;min-height:520px;border:1px solid #ddd;border-radius:8px;"
       loading="lazy">
     </iframe>
     <p style="text-align:center;margin-top:0.75rem;">
       <a href="{{ .Get "src" }}" target="_blank" rel="noopener">Open or download the brochure (PDF)</a>
     </p>
   </div>
