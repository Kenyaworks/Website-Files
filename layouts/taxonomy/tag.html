{{ define "main" }}

<div class="page-hero">
  <div class="max-w-6xl mx-auto px-4 sm:px-6">
    <a href="{{ "stories/" | relURL }}" style="color:rgba(255,255,255,0.6); font-size:0.875rem; text-decoration:none; display:inline-flex; align-items:center; gap:0.4rem; margin-bottom:1rem;">← All Stories</a>
    <h1>{{ .Title }}</h1>
  </div>
</div>

<div class="max-w-6xl mx-auto px-4 sm:px-6 py-16">
  {{ if .Pages }}
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    {{ range .Paginator.Pages }}
      {{ partial "post-card.html" . }}
    {{ end }}
  </div>
  {{ else }}
  <p style="color:var(--kw-text-muted); text-align:center; padding:4rem 0;">No stories yet in this category.</p>
  {{ end }}
</div>

{{ end }}
